name: Fetch RSS articles

on:
  schedule:
    - cron: '0 7 * * 1-5'  # Lun–Ven à 7h UTC (9h Paris)
  workflow_dispatch:        # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Fetch RSS
        run: node scripts/fetch-rss.mjs
        working-directory: frontend


      - name: Commit articles.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/articles.json
          git diff --cached --quiet || git commit -m "chore: mise à jour articles RSS $(date -u +%Y-%m-%d)"
          git push
