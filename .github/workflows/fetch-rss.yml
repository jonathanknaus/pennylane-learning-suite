# ⚠️ PASSE DE SECOURS. La passe qui fait foi est celle du dépôt veille-juridique :
# son articles.json publié est la source de vérité lue par les deux interfaces
# (voir articles-store.js), pour qu'un article traité par Sarah soit le même
# article ici. Celle-ci entretient la copie locale, utilisée en repli si Pages est
# indisponible. Le script, lui, doit rester identique dans les deux dépôts — il est
# synchronisé par scripts/sync-veille.sh, au nom d'agent HTTP près.

name: Fetch RSS articles

on:
  schedule:
    - cron: '0 6 * * 1'  # Lundi 8h00 heure de Paris (6h UTC)
  workflow_dispatch:        # Déclenchement manuel possible

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Fetch RSS
        run: node scripts/fetch-rss.mjs
        working-directory: frontend


      - name: Commit articles.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/articles.json
          git diff --cached --quiet || git commit -m "chore: mise à jour articles RSS $(date -u +%Y-%m-%d)"
          git push
